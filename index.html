<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JS Geometry Dash</title>
  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #111;
      color: white;
      font-family: sans-serif;
      overflow: hidden;
    }
    canvas {
      border: 3px solid #00ffff;
      background: linear-gradient(to bottom, #0a192f, #172a45);
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
    }
  </style>
</head>
<body>

<canvas id="gameCanvas" width="800" height="400"></canvas>

<script>
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  // Game settings
  const GROUND_Y = 330;
  const GRAVITY = 0.85;
  const JUMP_FORCE = -13.5;
  const GAME_SPEED = 6.5;

  let score = 0;
  let highScore = 0;
  let gameOver = false;
  let frameCount = 0;

  // Player Cube
  const player = {
    x: 100,
    y: GROUND_Y - 40,
    size: 40,
    dy: 0,
    rotation: 0,
    isGrounded: true
  };

  let obstacles = [];

  // Controls (Spacebar, Up Arrow, or Mouse Click/Tap)
  function jump() {
    if (gameOver) {
      resetGame();
      return;
    }
    if (player.isGrounded) {
      player.dy = JUMP_FORCE;
      player.isGrounded = false;
    }
  }

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') jump();
  });
  canvas.addEventListener('mousedown', jump);
  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    jump();
  });

  function resetGame() {
    player.y = GROUND_Y - player.size;
    player.dy = 0;
    player.rotation = 0;
    player.isGrounded = true;
    obstacles = [];
    score = 0;
    frameCount = 0;
    gameOver = false;
  }

  function spawnObstacle() {
    // Randomly spawn either a single spike, double spike, or a block
    const type = Math.random();
    if (type < 0.45) {
      // Single Spike
      obstacles.push({ type: 'spike', x: canvas.width, y: GROUND_Y, width: 35, height: 38 });
    } else if (type < 0.75) {
      // Double Spike
      obstacles.push({ type: 'spike', x: canvas.width, y: GROUND_Y, width: 35, height: 38 });
      obstacles.push({ type: 'spike', x: canvas.width + 35, y: GROUND_Y, width: 35, height: 38 });
    } else {
      // Solid Block (can jump on top of it)
      obstacles.push({ type: 'block', x: canvas.width, y: GROUND_Y - 40, width: 45, height: 40 });
    }
  }

  function update() {
    if (gameOver) return;

    frameCount++;
    score = Math.floor(frameCount / 5);
    if (score > highScore) highScore = score;

    // Apply gravity
    player.dy += GRAVITY;
    player.y += player.dy;

    // Rotate cube while airborne
    if (!player.isGrounded) {
      player.rotation += 0.14;
    } else {
      // Snap rotation cleanly to nearest 90 degrees when landing
      player.rotation = Math.round(player.rotation / (Math.PI / 2)) * (Math.PI / 2);
    }

    // Ground collision
    if (player.y + player.size >= GROUND_Y) {
      player.y = GROUND_Y - player.size;
      player.dy = 0;
      player.isGrounded = true;
    }

    // Spawn obstacles periodically
    if (frameCount % 85 === 0) {
      spawnObstacle();
    }

    // Update obstacles & check collisions
    for (let i = obstacles.length - 1; i >= 0; i--) {
      let obs = obstacles[i];
      obs.x -= GAME_SPEED;

      if (obs.type === 'spike') {
        // Forgiving hitbox for triangles
        const hitboxPadding = 8;
        if (
          player.x + player.size - hitboxPadding > obs.x + hitboxPadding &&
          player.x + hitboxPadding < obs.x + obs.width - hitboxPadding &&
          player.y + player.size - hitboxPadding > obs.y - obs.height + hitboxPadding
        ) {
          gameOver = true;
        }
      } else if (obs.type === 'block') {
        // Check AABB collision
        if (
          player.x < obs.x + obs.width &&
          player.x + player.size > obs.x &&
          player.y < obs.y + obs.height &&
          player.y + player.size > obs.y
        ) {
          // Land safely if hitting the top of the block while falling
          const prevBottom = (player.y - player.dy) + player.size;
          if (prevBottom <= obs.y + 10 && player.dy >= 0) {
            player.y = obs.y - player.size;
            player.dy = 0;
            player.isGrounded = true;
          } else {
            // Crashed into the side of the block
            gameOver = true;
          }
        }
      }

      // Remove off-screen obstacles
      if (obs.x + obs.width < 0) {
        obstacles.splice(i, 1);
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Floor
    ctx.fillStyle = '#00ffff';
    ctx.fillRect(0, GROUND_Y, canvas.width, 4);
    ctx.fillStyle = '#061020';
    ctx.fillRect(0, GROUND_Y + 4, canvas.width, canvas.height - GROUND_Y);

    // Draw Player (with rotation)
    ctx.save();
    ctx.translate(player.x + player.size / 2, player.y + player.size / 2);
    ctx.rotate(player.rotation);
    ctx.fillStyle = '#ffdd00';
    ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);
    // Cute Geometry Dash face
    ctx.fillStyle = '#000';
    ctx.fillRect(-10, -8, 6, 6);
    ctx.fillRect(4, -8, 6, 6);
    ctx.fillRect(-10, 4, 20, 5);
    ctx.restore();

    // Draw Obstacles
    obstacles.forEach((obs) => {
      if (obs.type === 'spike') {
        ctx.beginPath();
        ctx.moveTo(obs.x, obs.y);
        ctx.lineTo(obs.x + obs.width / 2, obs.y - obs.height);
        ctx.lineTo(obs.x + obs.width, obs.y);
        ctx.closePath();
        ctx.fillStyle = '#ff2a6d';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      } else if (obs.type === 'block') {
        ctx.fillStyle = '#05d9e8';
        ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(obs.x, obs.y, obs.width, obs.height);
      }
    });

    // Draw Score
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px sans-serif';
    ctx.fillText(`Score: ${score}`, 20, 35);
    ctx.fillText(`Best: ${highScore}`, 20, 62);

    // Game Over Overlay
    if (gameOver) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff2a6d';
      ctx.font = 'bold 42px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('CRASHED!', canvas.width / 2, canvas.height / 2 - 15);
      ctx.fillStyle = '#fff';
      ctx.font = '20px sans-serif';
      ctx.fillText('Press Space or Click to Restart', canvas.width / 2, canvas.height / 2 + 25);
      ctx.textAlign = 'left';
    }
  }

  function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
  }

  gameLoop();
</script>

</body>
</html>
