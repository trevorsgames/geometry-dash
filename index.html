<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flappy Bird</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #1a1a2e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    canvas {
      border: 3px solid #111;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: block;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas" width="320" height="480"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Load custom sprite images
    const sprites = {
      bird: new Image(),
      pipe: new Image(),
      bg: new Image(),
      ground: new Image()
    };
    sprites.bird.src = "bird.png";
    sprites.pipe.src = "pipe.png";
    sprites.bg.src = "bg.png";
    sprites.ground.src = "ground.png";

    function isReady(img) {
      return img.complete && img.naturalWidth > 0;
    }

    let frames = 0;
    let score = 0;
    let highScore = localStorage.getItem("flappyHighScore") || 0;
    let isGameOver = false;
    let gameOverAlpha = 0;
    let groundOffset = 0;
    const groundHeight = 56;

    const bird = {
      x: 65,
      y: 180,
      width: 34,
      height: 24,
      gravity: 0.25,
      velocity: 0,
      jump: -4.6,

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        const rotation = Math.min(Math.PI / 2, Math.max(-0.45, this.velocity * 0.1));
        ctx.rotate(rotation);

        if (isReady(sprites.bird)) {
          ctx.drawImage(sprites.bird, -this.width / 2, -this.height / 2, this.width, this.height);
        } else {
          // Fallback shape while image loads
          ctx.fillStyle = "#f4ce42";
          ctx.beginPath();
          ctx.ellipse(0, 0, 15, 12, 0, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      },

      update() {
        this.velocity += this.gravity;
        this.y += this.velocity;

        const floorY = canvas.height - groundHeight - this.height / 2;
        if (this.y >= floorY) {
          this.y = floorY;
          this.velocity = 0;
          endGame();
        }
        if (this.y - this.height / 2 < 0) {
          this.y = this.height / 2;
          this.velocity = 0;
        }
      },

      flap() {
        this.velocity = this.jump;
      }
    };

    const pipes = [];
    const pipeWidth = 52;
    const pipeGap = 115;

    function updatePipes() {
      if (isGameOver) return;

      if (frames % 105 === 0) {
        const maxTop = canvas.height - groundHeight - pipeGap - 50;
        const topHeight = Math.floor(Math.random() * (maxTop - 45)) + 45;
        pipes.push({
          x: canvas.width,
          top: topHeight,
          bottom: canvas.height - groundHeight - (topHeight + pipeGap),
          passed: false
        });
      }

      for (let i = 0; i < pipes.length; i++) {
        const p = pipes[i];
        p.x -= 2;

        const halfW = bird.width / 2 - 4;
        const halfH = bird.height / 2 - 3;
        const hitX = bird.x + halfW > p.x && bird.x - halfW < p.x + pipeWidth;
        const hitY = bird.y - halfH < p.top || bird.y + halfH > canvas.height - groundHeight - p.bottom;

        if (hitX && hitY) endGame();

        if (p.x + pipeWidth < bird.x && !p.passed) {
          score++;
          p.passed = true;
          if (score > highScore) {
            highScore = score;
            localStorage.setItem("flappyHighScore", highScore);
          }
        }

        if (p.x + pipeWidth < -10) {
          pipes.splice(i, 1);
          i--;
        }
      }
    }

    function drawPipes() {
      for (const p of pipes) {
        const bottomY = canvas.height - groundHeight - p.bottom;

        if (isReady(sprites.pipe)) {
          // Top pipe (flipped vertically so its rim faces down at the gap)
          ctx.save();
          ctx.translate(p.x + pipeWidth / 2, p.top);
          ctx.scale(1, -1);
          ctx.drawImage(sprites.pipe, -pipeWidth / 2, 0, pipeWidth, 320);
          ctx.restore();

          // Bottom pipe (normal orientation, rim at top)
          ctx.drawImage(sprites.pipe, p.x, bottomY, pipeWidth, 320);
        } else {
          ctx.fillStyle = "#73bf2e";
          ctx.fillRect(p.x, 0, pipeWidth, p.top);
          ctx.fillRect(p.x, bottomY, pipeWidth, p.bottom);
        }
      }
    }

    function drawBackground() {
      if (isReady(sprites.bg)) {
        ctx.drawImage(sprites.bg, 0, 0, canvas.width, canvas.height - groundHeight);
      } else {
        ctx.fillStyle = "#4ec0ca";
        ctx.fillRect(0, 0, canvas.width, canvas.height - groundHeight);
      }
    }

    function drawGround() {
      const y = canvas.height - groundHeight;
      if (!isGameOver) {
        groundOffset = (groundOffset + 2) % 16;
      }

      if (isReady(sprites.ground)) {
        ctx.drawImage(sprites.ground, -groundOffset, y, canvas.width + 16, groundHeight);
      } else {
        ctx.fillStyle = "#ded895";
        ctx.fillRect(0, y, canvas.width, groundHeight);
      }
    }

    function drawUI() {
      if (!isGameOver || gameOverAlpha < 0.5) {
        ctx.font = "bold 36px sans-serif";
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillText(score, canvas.width / 2 + 2, 57);
        ctx.fillStyle = "#fff";
        ctx.fillText(score, canvas.width / 2, 55);
      }

      if (isGameOver) {
        if (gameOverAlpha < 1) {
          gameOverAlpha = Math.min(1, gameOverAlpha + 0.018);
        }

        ctx.save();
        ctx.globalAlpha = gameOverAlpha;

        ctx.fillStyle = "rgba(0, 0, 0, 0.55)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const cardW = 230;
        const cardH = 150;
        const cardX = (canvas.width - cardW) / 2;
        const cardY = (canvas.height - cardH) / 2 - 15;

        ctx.fillStyle = "#ded895";
        ctx.strokeStyle = "#543847";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(cardX, cardY, cardW, cardH, 12);
        ctx.fill();
        ctx.stroke();

        ctx.textAlign = "center";
        ctx.fillStyle = "#e86101";
        ctx.font = "bold 28px sans-serif";
        ctx.fillText("GAME OVER", canvas.width / 2, cardY - 16);

        ctx.fillStyle = "#543847";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText(`SCORE: ${score}`, canvas.width / 2, cardY + 50);
        ctx.fillText(`BEST: ${highScore}`, canvas.width / 2, cardY + 85);

        ctx.font = "14px sans-serif";
        ctx.fillStyle = "#7a6635";
        ctx.fillText("Click or Press Space to Play Again", canvas.width / 2, cardY + 128);

        ctx.restore();
      }
    }

    function endGame() {
      isGameOver = true;
    }

    function resetGame() {
      bird.y = 180;
      bird.velocity = 0;
      pipes.length = 0;
      score = 0;
      frames = 0;
      isGameOver = false;
      gameOverAlpha = 0;
    }

    function handleInput(e) {
      if (e.type === "keydown" && e.code !== "Space") return;
      if (isGameOver) {
        if (gameOverAlpha > 0.65) resetGame();
      } else {
        bird.flap();
      }
    }

    window.addEventListener("keydown", handleInput);
    canvas.addEventListener("mousedown", handleInput);
    canvas.addEventListener("touchstart", (e) => {
      e.preventDefault();
      handleInput(e);
    });

    function loop() {
      drawBackground();
      updatePipes();
      drawPipes();
      drawGround();

      bird.update();
      bird.draw();

      drawUI();

      if (!isGameOver) frames++;
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
