<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trevor's Smooth Snake</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #1a1a1a;
      color: white;
      font-family: sans-serif;
    }
    canvas {
      border: 4px solid #4CAF50;
      background-color: #111;
    }
  </style>
</head>
<body>

  <h1>Score: <span id="score">0</span></h1>
  <canvas id="game" width="400" height="400"></canvas>
  <p>Use Arrow Keys or WASD to move</p>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreElement = document.getElementById("score");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    const stepInterval = 110; // Milliseconds per grid tile (lower = faster)

    let snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    let prevSnake = snake.map(p => ({ ...p }));
    let food = { x: 15, y: 10 };
    let dx = 0;
    let dy = 0;
    let inputQueue = [];
    let score = 0;
    let lastStepTime = 0;
    let isMoving = false;

    function gameLoop(timestamp) {
      if (!lastStepTime) lastStepTime = timestamp;
      const elapsed = timestamp - lastStepTime;

      // Advance the grid state when enough time has passed
      if (elapsed >= stepInterval) {
        update();
        lastStepTime = timestamp - (elapsed % stepInterval);
      }

      // Calculate interpolation progress (0.0 to 1.0)
      const progress = isMoving ? Math.min((timestamp - lastStepTime) / stepInterval, 1) : 1;
      draw(progress);

      requestAnimationFrame(gameLoop);
    }

    function update() {
      // Apply the next queued direction if available
      if (inputQueue.length > 0) {
        const nextDir = inputQueue.shift();
        dx = nextDir.x;
        dy = nextDir.y;
        isMoving = true;
      }

      if (!isMoving) return;

      // Save current positions before moving for smooth interpolation
      prevSnake = snake.map(part => ({ ...part }));

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Check wall or self collision
      if (
        head.x < 0 || head.x >= tileCount ||
        head.y < 0 || head.y >= tileCount ||
        snake.slice(0, -1).some(part => part.x === head.x && part.y === head.y)
      ) {
        alert("Game Over! Final Score: " + score);
        resetGame();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreElement.textContent = score;
        spawnFood();
        // Duplicate the tail in prevSnake so the newly grown segment slides out smoothly
        prevSnake.push({ ...prevSnake[prevSnake.length - 1] });
      } else {
        snake.pop();
      }
    }

    function draw(progress) {
      // Draw subtle checkerboard background like Google Snake
      for (let row = 0; row < tileCount; row++) {
        for (let col = 0; col < tileCount; col++) {
          ctx.fillStyle = (row + col) % 2 === 0 ? "#181818" : "#1f1f1f";
          ctx.fillRect(col * gridSize, row * gridSize, gridSize, gridSize);
        }
      }

      // Draw food as a circle
      ctx.fillStyle = "#ff4757";
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2.4,
        0,
        Math.PI * 2
      );
      ctx.fill();

      // Draw interpolated snake
      ctx.fillStyle = "#4CAF50";
      for (let i = 0; i < snake.length; i++) {
        const curr = snake[i];
        const prev = prevSnake[i] || curr;

        // Linear interpolation (lerp) between previous and current grid coordinates
        const interpX = prev.x + (curr.x - prev.x) * progress;
        const interpY = prev.y + (curr.y - prev.y) * progress;

        ctx.beginPath();
        ctx.roundRect(
          interpX * gridSize + 1,
          interpY * gridSize + 1,
          gridSize - 2,
          gridSize - 2,
          6 // Rounded corners connect segments smoothly around turns
        );
        ctx.fill();
      }
    }

    function spawnFood() {
      do {
        food = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      } while (snake.some(part => part.x === food.x && part.y === food.y));
    }

    function resetGame() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      prevSnake = snake.map(p => ({ ...p }));
      dx = 0;
      dy = 0;
      inputQueue = [];
      isMoving = false;
      score = 0;
      scoreElement.textContent = score;
      spawnFood();
    }

    document.addEventListener("keydown", e => {
      const lastDir = inputQueue.length > 0 ? inputQueue[inputQueue.length - 1] : { x: dx, y: dy };

      if ((e.key === "ArrowUp" || e.key === "w") && lastDir.y === 0) {
        inputQueue.push({ x: 0, y: -1 });
      } else if ((e.key === "ArrowDown" || e.key === "s") && lastDir.y === 0) {
        inputQueue.push({ x: 0, y: 1 });
      } else if ((e.key === "ArrowLeft" || e.key === "a") && lastDir.x === 0) {
        // Prevent starting straight left into your own body
        if (!isMoving) return;
        inputQueue.push({ x: -1, y: 0 });
      } else if ((e.key === "ArrowRight" || e.key === "d") && lastDir.x === 0) {
        inputQueue.push({ x: 1, y: 0 });
      }
    });

    requestAnimationFrame(gameLoop);
  </script>

</body>
</html>
